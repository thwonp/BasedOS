# How basedos-bluetooth attaches the 350H Ultra's Bluetooth chip (AP6611S, Broadcom/Synaptics
# BCM4345C0, on a UART) to the kernel. Sourced by basedos-bluetooth.
#
# As stock's ap6611s-bluetooth.service (read on the device, stock c8ed06c, 2026-11-24): stock's
# patchram tool loads the firmware at 1500000 baud on /dev/ttyS4 and stays running as the H4 line
# discipline. The stock kernel has no hci_uart Broadcom protocol, so btattach -P bcm can't work.
# Both the tool and the firmware are used in place from /stock (the tool needs only glibc);
# stock's /lib/firmware is a link its own boot fills, so the firmware's real path is named.
BT_UART=/dev/ttyS4
BT_BAUD=1500000
BT_ATTACH="/stock/usr/bin/brcm_patchram_plus_rk3399 -d --enable_hci --no2bytes --use_baudrate_for_download --tosleep 200000 --baudrate $BT_BAUD --patchram /stock/usr/lib/kernel-overlays/base/lib/firmware/bcm4345c0.hcd $BT_UART"

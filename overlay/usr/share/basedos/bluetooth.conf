# How basedos-bluetooth attaches the 350H Ultra's Bluetooth chip (AP6611S, Broadcom/Synaptics
# BCM4345C family, on a UART) to the kernel. Sourced by basedos-bluetooth.
#
# UNVERIFIED (2026-11-24, written without the device): stock runs ap6611s-bluetooth.service
# (`systemctl cat ap6611s-bluetooth` on stock gives the real UART, speed and firmware). Upstream
# ROCKNIX's service for its RK3588 boards runs brcm_patchram_plus on /dev/ttyS7 at 1500000 with
# SYN43711A0.hcd; the 350H Ultra's stock ships BCM4345C*.hcd instead. The UART is not known, and an
# attach on the wrong one would talk to whatever is there, so nothing is set until it is read from
# stock. The likely form, bluez's btattach with the kernel's Broadcom protocol (which loads
# brcm/<chip>.hcd itself), is below; if the kernel lacks that protocol, brcm_patchram_plus as stock.
#
# If the kernel attaches the chip itself (a serdev node in the device tree), hci0 is there already
# and nothing here runs.
BT_UART=
BT_BAUD=
BT_ATTACH=
# BT_ATTACH="btattach -B $BT_UART -P bcm -S $BT_BAUD"
